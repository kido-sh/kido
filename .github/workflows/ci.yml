name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: kido-vmm tests
        run: make test-vmm
      - name: build
        run: make

  linux-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: rust target (aarch64-unknown-linux-musl)
        run: rustup target add aarch64-unknown-linux-musl
      - name: test kido-vmm (rust)
        run: cd vmm-linux && RUSTFLAGS="-D warnings" cargo test --locked
      - name: check kido-vmm (linux/arm64)
        run: cd vmm-linux && cargo clippy --all-targets --locked --target aarch64-unknown-linux-musl -- -D warnings
      - name: vet (linux/arm64)
        run: GOOS=linux GOARCH=arm64 go vet ./...
      - name: dist (linux/arm64)
        run: TARGET_OS=linux TARGET_ARCH=arm64 make dist
      - name: test (linux)
        run: go test ./...
      - name: check install.sh
        run: sh -n install.sh && bash -n install.sh
