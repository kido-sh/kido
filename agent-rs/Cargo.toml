[package]
name = "kido-agent"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[[bin]]
name = "kido-agent"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2", default-features = false, features = ["rand_core", "zeroize"] }
hkdf = "0.12"
hmac = "0.12"
kido-aead = { path = "crates/kido-aead" }
libc = "0.2"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
x25519-dalek = { version = "2", features = ["zeroize"] }
zeroize = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.release.package.kido-aead]
opt-level = 3

[profile.release.package.aes]
opt-level = 3

[profile.release.package.aes-gcm]
opt-level = 3

[profile.release.package.ctr]
opt-level = 3

[profile.release.package.ghash]
opt-level = 3

[profile.release.package.polyval]
opt-level = 3

[profile.release.package.universal-hash]
opt-level = 3

[profile.release.package.sha2]
opt-level = 3
